name: Signal Runner V2 checks
on:
  push:
    branches: [feature/signal-runner-v2]
  pull_request:
    branches: [main]
jobs:
  cosmetics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check visuals and catalog contracts
        run: |
          node tests/audit.mjs
          node tests/runner-v2-cosmetics.test.mjs
          node tests/runner-v2-reflections.test.mjs
          node tests/runner-v2-portal.test.mjs
          node tests/runner-v2-playability.test.mjs
          node tests/runner-v2-session.test.mjs
          node tests/runner-v2-state-order.test.mjs
          node tests/runner-v2-obstacle-variety.test.mjs
          node tests/runner-v2-encounters.test.mjs
          node tests/runner-v2-boss-events.test.mjs
          node tests/runner-v2-server-hardening.test.mjs

  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real V2 interface at desktop and phone sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/signal-runner-preview-http.log 2>&1 &
          node tests/runner-standalone-browser-smoke.mjs
          node tests/runner-v2-browser-smoke.mjs
      - name: Verify independently hosted public preview on desktop and phone
        run: |
          PREVIEW_URL="https://ornivaise.github.io/northline-detailing-demo/signal-runner-v2-test.html"
          curl -fsSL --retry 12 --retry-delay 6 --retry-all-errors "$PREVIEW_URL" -o /tmp/signal-runner-public-preview.html
          grep -q 'id="runnerV2TestBar"' /tmp/signal-runner-public-preview.html
          RUNNER_TEST_URL="$PREVIEW_URL" node tests/runner-v2-browser-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-runner-v2-browser-preview
          path: artifacts/runner-preview/
          if-no-files-found: ignore
          retention-days: 7

  server-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check runner-store Edge Function
        run: deno check supabase/functions/runner-store/index.ts

